<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REKOM Safe Zone Checker</title>
    <!-- Biblioteker hentet via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Font: Josefin Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #16322D; 
            color: #E6BD71; 
            margin: 0; 
            font-family: 'Josefin Sans', ui-sans-serif, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .safe-zone-overlay {
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 10;
        }
        .mock-ui-overlay {
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 20;
            color: white;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #16322D; }
        ::-webkit-scrollbar-thumb { background: #E6BD71; border-radius: 10px; }

        .device-frame {
            box-shadow: 0 0 0 12px #0a1816, 0 40px 120px rgba(0,0,0,0.9);
            background: #1a3a35;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(230, 189, 113, 0.15);
            backdrop-filter: blur(10px);
        }

        .format-warning {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ff8a8a;
        }

        /* Custom Video Scrubber Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #E6BD71;
            cursor: pointer;
            margin-top: -4px;
            box-shadow: 0 0 10px rgba(230,189,113,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(230, 189, 113, 0.2);
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Udvidet bibliotek af SVG-ikoner
        const icons = {
            upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>,
            'help-circle': <g><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></g>,
            smartphone: <g><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></g>,
            info: <g><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></g>,
            'refresh-cw': <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M3 21v-5h5"/>,
            'alert-triangle': <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z M12 9v4 M12 17h.01"/>,
            'check-circle': <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14 M22 4 12 14.01l-3-3"/>,
            x: <path d="M18 6 6 18M6 6l12 12"/>,
            play: <polygon points="5 3 19 12 5 21 5 3"/>,
            pause: <g><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></g>,
            'volume-2': <g><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></g>,
            'volume-x': <g><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></g>,
            eye: <g><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></g>,
            'eye-off': <g><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></g>,
            heart: <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>,
            'message-circle': <path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/>,
            'share-2': <g><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></g>,
            bookmark: <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>,
            'more-horizontal': <g><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></g>,
            send: <g><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></g>,
            music: <g><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></g>,
            user: <g><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>,
            'layout-template': <g><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><rect width="18" height="7" x="3" y="3"/><rect width="7" height="11" x="3" y="10"/></g>
        };

        const Icon = ({ name, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className || "w-4 h-4"}
            >
                {icons[name] || null}
            </svg>
        );

        function App() {
            // Filer og formater
            const [file, setFile] = useState(null);
            const [fileType, setFileType] = useState(null);
            const [platform, setPlatform] = useState('meta'); 
            const [subFormat, setSubFormat] = useState('reels'); 
            const [is916, setIs916] = useState(true);
            const [showMockUI, setShowMockUI] = useState(false);
            
            // Video Controllers
            const videoRef = useRef(null);
            const fileInputRef = useRef(null);
            const [isPlaying, setIsPlaying] = useState(true);
            const [isMuted, setIsMuted] = useState(true);
            const [progress, setProgress] = useState(0);

            const handleFile = (e) => {
                const uploadedFile = e.target.files?.[0] || e.dataTransfer?.files?.[0];
                if (!uploadedFile) return;
                
                const type = uploadedFile.type.startsWith('video') ? 'video' : 'image';
                setFileType(type);
                const url = URL.createObjectURL(uploadedFile);
                setFile(url);
                setProgress(0);
                setIsPlaying(true);

                if (type === 'image') {
                    const img = new Image();
                    img.onload = () => {
                        const ratio = img.width / img.height;
                        setIs916(Math.abs(ratio - 0.5625) < 0.05);
                    };
                    img.src = url;
                } else {
                    const video = document.createElement('video');
                    video.onloadedmetadata = () => {
                        const ratio = video.videoWidth / video.videoHeight;
                        setIs916(Math.abs(ratio - 0.5625) < 0.05);
                    };
                    video.src = url;
                }
            };

            // Afspillerfunktioner
            const togglePlay = () => {
                if (videoRef.current) {
                    if (isPlaying) videoRef.current.pause();
                    else videoRef.current.play();
                    setIsPlaying(!isPlaying);
                }
            };

            const toggleMute = () => {
                if (videoRef.current) {
                    videoRef.current.muted = !videoRef.current.muted;
                    setIsMuted(!isMuted);
                }
            };

            const handleTimeUpdate = () => {
                if (videoRef.current && videoRef.current.duration) {
                    setProgress((videoRef.current.currentTime / videoRef.current.duration) * 100);
                }
            };

            const handleSeek = (e) => {
                const newProgress = e.target.value;
                if (videoRef.current && videoRef.current.duration) {
                    videoRef.current.currentTime = (newProgress / 100) * videoRef.current.duration;
                    setProgress(newProgress);
                }
            };

            const getSafeZones = () => {
                if (platform === 'tiktok') return { top: 5.6, bottom: 18, left: 6, right: 12, notch: false };
                if (platform === 'snapchat') return { top: 10, bottom: 35, left: 6, right: 6, notch: true, notchH: 12, notchW: 18 };
                if (subFormat === 'reels') return { top: 14, bottom: 25, left: 6, right: 6, notch: true, notchH: 6, notchW: 22 };
                return { top: 14, bottom: 20, left: 6, right: 6, notch: false };
            };

            const zones = getSafeZones();

            // Mock UI Komponent (Tegner platformenes knapper op)
            const renderMockUI = () => {
                if (!showMockUI) return null;

                if (platform === 'tiktok') {
                    return (
                        <div className="mock-ui-overlay animate-fade-in">
                            <div className="absolute right-3 lg:right-4 bottom-24 flex flex-col gap-4 items-center">
                                <div className="w-9 h-9 rounded-full bg-white/20 border-2 border-white flex items-center justify-center backdrop-blur-md">
                                   <Icon name="user" className="w-5 h-5"/>
                                </div>
                                <div className="flex flex-col items-center gap-1"><Icon name="heart" className="w-7 h-7 fill-current"/><span className="text-[10px] font-bold">123K</span></div>
                                <div className="flex flex-col items-center gap-1"><Icon name="message-circle" className="w-7 h-7 fill-current"/><span className="text-[10px] font-bold">456</span></div>
                                <div className="flex flex-col items-center gap-1"><Icon name="bookmark" className="w-6 h-6 fill-current"/><span className="text-[10px] font-bold">78</span></div>
                                <div className="flex flex-col items-center gap-1"><Icon name="share-2" className="w-6 h-6 fill-current"/><span className="text-[10px] font-bold">9</span></div>
                                <div className="w-8 h-8 mt-2 rounded-full bg-[#16322D] border-[6px] border-black flex items-center justify-center">
                                    <Icon name="music" className="w-3 h-3 text-[#E6BD71]"/>
                                </div>
                            </div>
                            <div className="absolute left-4 bottom-6 pr-16 text-sm flex flex-col gap-2">
                                <div className="font-bold text-[13px]">@rekom_group</div>
                                <div className="text-[12px] leading-snug">Test af din captions længde for at se, om den dækker over vigtigt indhold i bunden. #rekom #safezone</div>
                                <div className="flex items-center gap-2 text-[11px] font-semibold mt-1">
                                    <Icon name="music" className="w-3 h-3"/> Original lyd - REKOM
                                </div>
                            </div>
                        </div>
                    );
                }
                if (platform === 'meta' && subFormat === 'reels') {
                     return (
                        <div className="mock-ui-overlay animate-fade-in">
                            <div className="absolute right-3 lg:right-4 bottom-24 flex flex-col gap-5 items-center">
                                <div className="flex flex-col items-center gap-1"><Icon name="heart" className="w-6 h-6"/><span className="text-[10px] font-bold">123K</span></div>
                                <div className="flex flex-col items-center gap-1"><Icon name="message-circle" className="w-6 h-6"/><span className="text-[10px] font-bold">456</span></div>
                                <div className="flex flex-col items-center gap-1"><Icon name="send" className="w-6 h-6"/></div>
                                <Icon name="more-horizontal" className="w-5 h-5 mt-2"/>
                                <div className="w-7 h-7 mt-2 rounded-md border-2 border-white bg-white/20 backdrop-blur-md"></div>
                            </div>
                            <div className="absolute left-4 bottom-8 pr-20 text-sm flex flex-col gap-2.5">
                                <div className="flex items-center gap-2">
                                    <div className="w-8 h-8 rounded-full bg-white/30 border border-white backdrop-blur-sm"></div>
                                    <div className="font-bold text-[13px] drop-shadow-md">rekom_group</div>
                                    <div className="border border-white rounded-full px-2.5 py-0.5 text-[9px] font-bold">Følg</div>
                                </div>
                                <div className="text-[12px] drop-shadow-md">Dette er en Meta Reel. Teksten kan fylde lidt. <span className="opacity-70">mere</span></div>
                                <div className="flex items-center gap-2 text-[10px] bg-black/40 w-max px-2.5 py-1 rounded-full backdrop-blur-md">
                                    <Icon name="music" className="w-3 h-3"/> Original lyd
                                </div>
                            </div>
                        </div>
                    );
                }
                if (platform === 'meta' && subFormat === 'stories') {
                     return (
                        <div className="mock-ui-overlay animate-fade-in">
                            <div className="absolute top-4 left-3 right-3 flex gap-1">
                                <div className="h-0.5 bg-white/30 flex-1 rounded-full"><div className="w-1/3 h-full bg-white rounded-full"></div></div>
                                <div className="h-0.5 bg-white/30 flex-1 rounded-full"></div>
                                <div className="h-0.5 bg-white/30 flex-1 rounded-full"></div>
                            </div>
                            <div className="absolute top-8 left-3 flex items-center gap-2">
                                <div className="w-8 h-8 rounded-full bg-white/30 border border-white backdrop-blur-sm"></div>
                                <div className="font-bold text-[12px] drop-shadow-md">rekom_group <span className="text-white/70 font-normal">2t</span></div>
                            </div>
                            <div className="absolute top-9 right-4">
                               <Icon name="more-horizontal" className="w-5 h-5"/>
                            </div>
                            <div className="absolute bottom-6 left-4 right-4 flex gap-4 items-center">
                                <div className="flex-1 h-10 border border-white/50 rounded-full flex items-center px-4 text-[12px] text-white/90 backdrop-blur-md bg-black/10">
                                    Send besked...
                                </div>
                                <Icon name="heart" className="w-6 h-6"/>
                                <Icon name="send" className="w-6 h-6"/>
                            </div>
                        </div>
                    );
                }
                if (platform === 'snapchat') {
                     return (
                        <div className="mock-ui-overlay animate-fade-in">
                            <div className="absolute right-3 lg:right-4 top-1/4 flex flex-col gap-3 items-center bg-black/20 backdrop-blur-md p-2 rounded-full border border-white/10">
                                <div className="w-9 h-9 bg-black/30 rounded-full flex items-center justify-center"><Icon name="user" className="w-5 h-5"/></div>
                                <div className="w-9 h-9 bg-black/30 rounded-full flex items-center justify-center"><Icon name="music" className="w-5 h-5"/></div>
                                <div className="w-9 h-9 bg-black/30 rounded-full flex items-center justify-center"><Icon name="more-horizontal" className="w-5 h-5"/></div>
                            </div>
                            <div className="absolute bottom-8 left-4 right-4 flex flex-col gap-4">
                                 <div className="flex flex-col gap-1 drop-shadow-lg pr-12">
                                    <div className="font-bold text-[15px]">rekom_group</div>
                                    <div className="text-[13px]">Snapchat tekst ligger typisk her og fylder lidt plads i bunden ✨</div>
                                 </div>
                                 <div className="flex items-center justify-center w-full">
                                    <div className="bg-black/50 backdrop-blur-xl px-6 py-3.5 rounded-full flex gap-8 items-center border border-white/10 w-full justify-between">
                                        <div className="text-[12px] opacity-70 font-bold tracking-widest">CHAT</div>
                                        <div className="flex gap-4">
                                            <Icon name="message-circle" className="w-5 h-5"/>
                                            <Icon name="send" className="w-5 h-5"/>
                                        </div>
                                    </div>
                                 </div>
                            </div>
                        </div>
                    );
                }
                return null;
            }

            return (
                <div className="min-h-screen flex flex-col items-center">
                    
                    {/* Header */}
                    <header className="w-full py-6 lg:py-8 2xl:py-14 flex flex-col items-center">
                        <img 
                            src="logo.png" 
                            alt="REKOM Logo" 
                            className="h-10 lg:h-12 2xl:h-16 object-contain mb-4 2xl:mb-6"
                            onError={(e) => { e.target.style.display = 'none'; }}
                        />
                        <div className="w-24 lg:w-32 2xl:w-40 h-1 bg-[#E6BD71] rounded-full shadow-[0_0_15px_rgba(230,189,113,0.3)]"></div>
                    </header>

                    {/* Main Container */}
                    <main className="flex-grow flex flex-col lg:flex-row items-center lg:items-start justify-center gap-8 lg:gap-12 xl:gap-16 px-4 md:px-6 max-w-7xl mx-auto w-full pb-10 lg:pb-12 2xl:pb-20 mt-2 lg:mt-4">
                        
                        {/* Venstre Kolonne: Preview & Controls */}
                        <div className="flex flex-col items-center w-full max-w-[260px] lg:max-w-[280px] xl:max-w-[320px] 2xl:max-w-[360px] animate-fade-in" style={{ animationDelay: '0.1s' }}>
                            <h2 className="text-[10px] 2xl:text-[11px] tracking-[0.7em] font-black mb-6 2xl:mb-10 opacity-50 uppercase text-center w-full">
                                Forhåndsvisning
                            </h2>
                            
                            {/* Device Frame */}
                            <div 
                                className={`relative w-full aspect-[9/16] rounded-[2rem] 2xl:rounded-[2.5rem] overflow-hidden transition-all duration-500 device-frame ${!file ? 'border-2 border-dashed border-[#E6BD71]/40 hover:bg-[#1e423d] cursor-pointer' : 'bg-black'}`}
                                onClick={() => !file && fileInputRef.current.click()}
                            >
                                {!file ? (
                                    <div className="absolute inset-0 flex flex-col items-center justify-center p-8 2xl:p-12 text-center group">
                                        <div className="w-16 h-16 2xl:w-24 2xl:h-24 border-2 border-[#E6BD71]/40 rounded-full flex items-center justify-center mb-6 2xl:mb-10 transition-all group-hover:scale-110 group-hover:border-[#E6BD71]/80 group-hover:bg-[#E6BD71]/10">
                                            <Icon name="upload" className="w-8 h-8 2xl:w-10 2xl:h-10 text-[#E6BD71]" />
                                        </div>
                                        <p className="text-white font-black text-lg xl:text-xl 2xl:text-2xl mb-2 2xl:mb-3 tracking-tight text-center uppercase">Upload indhold</p>
                                        <p className="text-[#E6BD71]/80 text-[9px] 2xl:text-[11px] font-bold uppercase tracking-[0.3em] max-w-[160px] 2xl:max-w-[200px] text-center">
                                            Træk fil herover eller klik for at vælge
                                        </p>
                                    </div>
                                ) : (
                                    <>
                                        {/* Media */}
                                        {fileType === 'video' ? (
                                            <video 
                                                ref={videoRef}
                                                src={file} 
                                                autoPlay 
                                                loop 
                                                muted={isMuted} 
                                                playsInline 
                                                className="w-full h-full object-cover"
                                                onTimeUpdate={handleTimeUpdate}
                                            />
                                        ) : (
                                            <img src={file} className="w-full h-full object-cover" alt="Preview" />
                                        )}

                                        {/* Safe Zone Overlay */}
                                        <div className="safe-zone-overlay">
                                            <svg className="w-full h-full" viewBox="0 0 100 177.7" preserveAspectRatio="none">
                                                <defs>
                                                    <mask id="sz-mask">
                                                        <rect width="100" height="177.7" fill="white" />
                                                        <rect 
                                                           x={zones.left} 
                                                           y={zones.top} 
                                                           width={100 - zones.left - zones.right}
                                                           height={177.7 - zones.top - (177.7 * zones.bottom / 100)}
                                                           fill="black" 
                                                        />
                                                        {zones.notch && (
                                                            <rect 
                                                              x={100 - zones.notchW} 
                                                              y={177.7 - (177.7 * zones.bottom / 100) - zones.notchH} 
                                                              width={zones.notchW} 
                                                              height={zones.notchH} 
                                                              fill="white" 
                                                            />
                                                        )}
                                                    </mask>
                                                </defs>
                                                <rect width="100" height="177.7" fill="#E6BD71" fillOpacity="0.45" mask="url(#sz-mask)" />
                                            </svg>
                                        </div>

                                        {/* Platform UI Simulator Overlay */}
                                        {renderMockUI()}
                                    </>
                                )}
                            </div>

                            {/* Video Control Bar */}
                            {file && fileType === 'video' && (
                                <div className="mt-5 w-full bg-white/[0.04] border border-[#E6BD71]/20 rounded-xl p-3 lg:p-4 flex items-center gap-3 lg:gap-4 shadow-lg animate-fade-in backdrop-blur-md">
                                    <button onClick={togglePlay} className="text-[#E6BD71] hover:text-white transition-colors focus:outline-none">
                                        <Icon name={isPlaying ? "pause" : "play"} className="w-4 h-4 lg:w-5 lg:h-5 fill-current" />
                                    </button>
                                    
                                    <input 
                                        type="range" 
                                        min="0" 
                                        max="100" 
                                        value={progress} 
                                        onChange={handleSeek}
                                        className="flex-1"
                                    />
                                    
                                    <button onClick={toggleMute} className="text-[#E6BD71] hover:text-white transition-colors focus:outline-none">
                                        <Icon name={isMuted ? "volume-x" : "volume-2"} className="w-4 h-4 lg:w-5 lg:h-5" />
                                    </button>
                                </div>
                            )}

                            {/* Format Status Indikator */}
                            {file && (
                                <div className={`mt-4 2xl:mt-5 w-full flex items-center justify-center gap-2 2xl:gap-3 px-4 2xl:px-6 py-2.5 2xl:py-3 rounded-xl animate-fade-in ${is916 ? 'bg-green-500/10 border border-green-500/20 text-green-400' : 'format-warning'}`}>
                                    <Icon name={is916 ? 'check-circle' : 'alert-triangle'} className="w-4 h-4 2xl:w-5 2xl:h-5" />
                                    <span className="text-[9px] 2xl:text-[11px] font-bold uppercase tracking-widest">
                                        {is916 ? 'Korrekt format (9:16)' : 'Forkert format (Ikke 9:16)'}
                                    </span>
                                </div>
                            )}
                        </div>

                        {/* Højre Kolonne: Styringspanel */}
                        <div className="w-full max-w-[320px] lg:max-w-[300px] xl:max-w-[340px] flex flex-col gap-4 2xl:gap-5 animate-fade-in" style={{ animationDelay: '0.2s' }}>
                            
                            <div className="glass-card rounded-[1.5rem] 2xl:rounded-[2rem] p-5 2xl:p-6 shadow-lg text-[#E6BD71]">
                                <h3 className="text-lg xl:text-xl 2xl:text-2xl font-bold mb-3 2xl:mb-4 flex items-center gap-2 2xl:gap-3 tracking-tight">
                                    <Icon name="help-circle" className="w-4 h-4 xl:w-5 xl:h-5 2xl:w-6 2xl:h-6" /> Hvad er safe zone?
                                </h3>
                                <div className="text-[12px] xl:text-[13px] 2xl:text-[15px] leading-relaxed font-normal space-y-2 2xl:space-y-3 text-[#f5e6cc]">
                                    <p>En safe zone på Meta, Snapchat og TikTok er det område i dit annonceformat, hvor tekst og vigtige elementer sikkert kan placeres uden at blive dækket af UI-elementer som brugernavn, CTA-knapper, likes eller captions.</p>
                                    <p>For at sikre korrekt visning på stories og reels skal det uploadede content være i <strong>9:16-format</strong>.</p>
                                </div>
                            </div>

                            <div className="glass-card rounded-[1.5rem] 2xl:rounded-[2rem] p-5 2xl:p-6 shadow-lg text-[#E6BD71]">
                                <div className="flex justify-between items-center mb-3 2xl:mb-4">
                                    <h3 className="text-lg xl:text-xl 2xl:text-2xl font-bold flex items-center gap-2 2xl:gap-3 tracking-tight">
                                        <Icon name="smartphone" className="w-4 h-4 xl:w-5 xl:h-5 2xl:w-6 2xl:h-6" /> Vælg Platform
                                    </h3>
                                    
                                    {/* Toggle Mock UI Knap */}
                                    <button 
                                        onClick={() => setShowMockUI(!showMockUI)}
                                        className={`flex items-center gap-2 px-3 py-1.5 rounded-lg border text-[9px] 2xl:text-[10px] font-bold uppercase tracking-widest transition-all ${showMockUI ? 'bg-[#E6BD71] text-[#16322D] border-[#E6BD71]' : 'border-[#E6BD71]/30 hover:border-[#E6BD71]/80 hover:bg-white/5'}`}
                                        title="Vis eller skjul platformens knapper og tekst"
                                    >
                                        <Icon name={showMockUI ? "eye-off" : "eye"} className="w-3 h-3 2xl:w-3.5 2xl:h-3.5" />
                                        UI
                                    </button>
                                </div>
                                
                                <div className="grid grid-cols-3 gap-1.5 2xl:gap-2 bg-black/40 p-1 2xl:p-1.5 rounded-xl mb-3 2xl:mb-4">
                                    {['meta', 'tiktok', 'snapchat'].map((p) => (
                                        <button 
                                            key={p}
                                            onClick={() => setPlatform(p)}
                                            className={`py-2 2xl:py-2.5 rounded-lg font-bold text-[9px] 2xl:text-[10px] transition-all duration-300 uppercase tracking-widest ${platform === p ? 'bg-[#E6BD71] text-[#16322D] shadow-md scale-[1.02]' : 'opacity-40 hover:opacity-100'}`}
                                        >
                                            {p}
                                        </button>
                                    ))}
                                </div>

                                {platform === 'meta' && (
                                    <div className="flex gap-2 animate-fade-in">
                                        {['reels', 'stories'].map(sub => (
                                            <button 
                                                key={sub}
                                                onClick={() => setSubFormat(sub)}
                                                className={`flex-1 py-1.5 2xl:py-2 rounded-lg font-bold text-[8px] 2xl:text-[9px] border-2 transition-all duration-300 uppercase tracking-widest ${subFormat === sub ? 'border-[#E6BD71] text-[#E6BD71] bg-[#E6BD71]/10 shadow-[0_0_15px_rgba(230,189,113,0.1)]' : 'border-[#E6BD71]/40 text-[#f5e6cc]/70 hover:border-[#E6BD71]/70 hover:text-[#f5e6cc]'}`}
                                            >
                                                {sub}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="glass-card rounded-[1.5rem] 2xl:rounded-[2rem] p-5 2xl:p-6 shadow-lg text-[#E6BD71]">
                                <h3 className="text-lg xl:text-xl 2xl:text-2xl font-bold mb-3 2xl:mb-4 flex items-center gap-2 2xl:gap-3 tracking-tight">
                                    <Icon name="info" className="w-4 h-4 xl:w-5 xl:h-5 2xl:w-6 2xl:h-6" /> Sådan gør du
                                </h3>
                                <ul className="space-y-2 2xl:space-y-3">
                                    {[
                                        "Upload dit medie (MP4, JPG, PNG).",
                                        "Vælg din ønskede platform.",
                                        "Slå evt. UI Overlay til ovenfor.",
                                        "Brug scrubberen til at fryse videoen."
                                    ].map((text, i) => (
                                        <li key={i} className="flex gap-3 2xl:gap-4 items-start text-[12px] xl:text-[13px] 2xl:text-[15px] leading-snug font-normal text-[#f5e6cc]">
                                            <span className="w-4 h-4 2xl:w-5 2xl:h-5 rounded-full border-2 border-[#E6BD71]/50 flex items-center justify-center text-[8px] 2xl:text-[9px] font-bold shrink-0 mt-0.5 text-[#E6BD71]">
                                                {i + 1}
                                            </span>
                                            {text}
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            {file && (
                                <button
                                    onClick={() => {
                                        setFile(null);
                                        if (fileInputRef.current) fileInputRef.current.value = "";
                                    }}
                                    className="w-full py-4 2xl:py-5 rounded-[1.5rem] 2xl:rounded-[2rem] font-bold flex items-center justify-center gap-3 2xl:gap-4 bg-[#E6BD71] text-[#16322D] text-[10px] 2xl:text-[12px] uppercase tracking-[0.2em] shadow-lg hover:brightness-110 active:scale-95 transition-all duration-300 animate-fade-in"
                                >
                                    <Icon name="refresh-cw" className="w-4 h-4 2xl:w-5 2xl:h-5" />
                                    Upload ny fil
                                </button>
                            )}
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="w-full flex flex-col items-center gap-2 2xl:gap-3 py-6 lg:py-8 2xl:py-16 mt-auto text-center">
                        <p className="text-[12px] 2xl:text-[14px] font-black tracking-[0.6em] uppercase">
                            REKOM Safe Zone Checker
                        </p>
                        <p className="text-[9px] 2xl:text-[10px] tracking-[0.2em] font-bold text-[#E6BD71] uppercase opacity-100">
                            Udviklet af: Frederik Nielsen
                        </p>
                    </footer>

                    <input type="file" ref={fileInputRef} className="hidden" accept="image/*,video/*" onChange={handleFile} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
