<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REKOM Safe Zone Checker</title>
    <!-- Biblioteker hentet via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Font: Josefin Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #16322D; 
            color: #E6BD71; 
            margin: 0; 
            font-family: 'Josefin Sans', ui-sans-serif, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .safe-zone-overlay {
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 10;
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #16322D; }
        ::-webkit-scrollbar-thumb { background: #E6BD71; border-radius: 10px; }

        .device-frame {
            box-shadow: 0 0 0 12px #0a1816, 0 40px 120px rgba(0,0,0,0.9);
            background: #1a3a35;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(230, 189, 113, 0.15);
            backdrop-filter: blur(10px);
        }

        .format-warning {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ff8a8a;
        }

        /* Custom Video Scrubber Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 10px;
            width: 10px;
            border-radius: 50%;
            background: #E6BD71;
            cursor: pointer;
            margin-top: -3px;
            box-shadow: 0 0 10px rgba(230,189,113,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(230, 189, 113, 0.2);
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
        
        /* 2xl Custom Scrubber */
        @media (min-width: 1536px) {
            input[type=range]::-webkit-slider-thumb {
                height: 12px;
                width: 12px;
                margin-top: -4px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const icons = {
            upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>,
            'help-circle': <g><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></g>,
            smartphone: <g><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></g>,
            info: <g><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></g>,
            'refresh-cw': <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M3 21v-5h5"/>,
            'alert-triangle': <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z M12 9v4 M12 17h.01"/>,
            'check-circle': <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14 M22 4 12 14.01l-3-3"/>,
            x: <path d="M18 6 6 18M6 6l12 12"/>,
            play: <polygon points="5 3 19 12 5 21 5 3"/>,
            pause: <g><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></g>,
            'volume-2': <g><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></g>,
            'volume-x': <g><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></g>
        };

        const Icon = ({ name, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className || "w-4 h-4"}
            >
                {icons[name] || null}
            </svg>
        );

        function App() {
            const [file, setFile] = useState(null);
            const [fileType, setFileType] = useState(null);
            const [platform, setPlatform] = useState('meta'); 
            const [subFormat, setSubFormat] = useState('reels'); 
            const [is916, setIs916] = useState(true);
            
            const videoRef = useRef(null);
            const fileInputRef = useRef(null);
            const [isPlaying, setIsPlaying] = useState(true);
            const [isMuted, setIsMuted] = useState(true);
            const [progress, setProgress] = useState(0);

            const handleFile = (e) => {
                const uploadedFile = e.target.files?.[0] || e.dataTransfer?.files?.[0];
                if (!uploadedFile) return;
                
                const type = uploadedFile.type.startsWith('video') ? 'video' : 'image';
                setFileType(type);
                const url = URL.createObjectURL(uploadedFile);
                setFile(url);
                setProgress(0);
                setIsPlaying(true);

                if (type === 'image') {
                    const img = new Image();
                    img.onload = () => {
                        const ratio = img.width / img.height;
                        setIs916(Math.abs(ratio - 0.5625) < 0.05);
                    };
                    img.src = url;
                } else {
                    const video = document.createElement('video');
                    video.onloadedmetadata = () => {
                        const ratio = video.videoWidth / video.videoHeight;
                        setIs916(Math.abs(ratio - 0.5625) < 0.05);
                    };
                    video.src = url;
                }
            };

            const togglePlay = () => {
                if (videoRef.current) {
                    if (isPlaying) videoRef.current.pause();
                    else videoRef.current.play();
                    setIsPlaying(!isPlaying);
                }
            };

            const toggleMute = () => {
                if (videoRef.current) {
                    videoRef.current.muted = !videoRef.current.muted;
                    setIsMuted(!isMuted);
                }
            };

            const handleTimeUpdate = () => {
                if (videoRef.current && videoRef.current.duration) {
                    setProgress((videoRef.current.currentTime / videoRef.current.duration) * 100);
                }
            };

            const handleSeek = (e) => {
                const newProgress = e.target.value;
                if (videoRef.current && videoRef.current.duration) {
                    videoRef.current.currentTime = (newProgress / 100) * videoRef.current.duration;
                    setProgress(newProgress);
                }
            };

            const getSafeZones = () => {
                if (platform === 'tiktok') return { top: 5.6, bottom: 18, left: 6, right: 12, notch: false };
                if (platform === 'snapchat') return { top: 10, bottom: 35, left: 6, right: 6, notch: true, notchH: 12, notchW: 18 };
                if (subFormat === 'reels') return { top: 14, bottom: 25, left: 6, right: 6, notch: true, notchH: 6, notchW: 22 };
                return { top: 14, bottom: 20, left: 6, right: 6, notch: false };
            };

            const zones = getSafeZones();

            return (
                <div className="min-h-screen flex flex-col items-center justify-between">
                    
                    {/* Header - Kraftigt skaleret ned på laptop-størrelse */}
                    <header className="w-full pt-6 pb-2 lg:pt-8 lg:pb-4 2xl:pt-14 2xl:pb-8 flex flex-col items-center">
                        <img 
                            src="logo.png" 
                            alt="REKOM Logo" 
                            className="h-8 lg:h-10 xl:h-12 2xl:h-16 object-contain mb-3 2xl:mb-6"
                            onError={(e) => { e.target.style.display = 'none'; }}
                        />
                        <div className="w-16 lg:w-24 2xl:w-40 h-1 bg-[#E6BD71] rounded-full shadow-[0_0_15px_rgba(230,189,113,0.3)]"></div>
                    </header>

                    {/* Main Container - Tættere gap og margins */}
                    <main className="flex flex-col lg:flex-row items-center lg:items-start justify-center gap-6 lg:gap-10 xl:gap-14 2xl:gap-20 px-4 md:px-6 max-w-7xl mx-auto w-full my-auto">
                        
                        {/* Venstre Kolonne: Preview & Controls */}
                        <div className="flex flex-col items-center w-full max-w-[220px] lg:max-w-[240px] xl:max-w-[260px] 2xl:max-w-[360px] animate-fade-in" style={{ animationDelay: '0.1s' }}>
                            <h2 className="text-[8px] xl:text-[9px] 2xl:text-[11px] tracking-[0.7em] font-black mb-4 2xl:mb-10 opacity-50 uppercase text-center w-full">
                                Forhåndsvisning
                            </h2>
                            
                            {/* Device Frame */}
                            <div 
                                className={`relative w-full aspect-[9/16] rounded-[1.5rem] 2xl:rounded-[2.5rem] overflow-hidden transition-all duration-500 device-frame ${!file ? 'border-2 border-dashed border-[#E6BD71]/40 hover:bg-[#1e423d] cursor-pointer' : 'bg-black'}`}
                                onClick={() => !file && fileInputRef.current.click()}
                            >
                                {!file ? (
                                    <div className="absolute inset-0 flex flex-col items-center justify-center p-6 2xl:p-12 text-center group">
                                        <div className="w-14 h-14 xl:w-16 xl:h-16 2xl:w-24 2xl:h-24 border-2 border-[#E6BD71]/40 rounded-full flex items-center justify-center mb-4 2xl:mb-10 transition-all group-hover:scale-110 group-hover:border-[#E6BD71]/80 group-hover:bg-[#E6BD71]/10">
                                            <Icon name="upload" className="w-6 h-6 xl:w-8 xl:h-8 2xl:w-10 2xl:h-10 text-[#E6BD71]" />
                                        </div>
                                        <p className="text-white font-black text-sm xl:text-base 2xl:text-2xl mb-1.5 2xl:mb-3 tracking-tight text-center uppercase">Upload indhold</p>
                                        <p className="text-[#E6BD71]/80 text-[7px] xl:text-[8px] 2xl:text-[11px] font-bold uppercase tracking-[0.3em] max-w-[140px] 2xl:max-w-[200px] text-center">
                                            Træk fil herover eller klik for at vælge
                                        </p>
                                    </div>
                                ) : (
                                    <>
                                        {fileType === 'video' ? (
                                            <video 
                                                ref={videoRef}
                                                src={file} 
                                                autoPlay 
                                                loop 
                                                muted={isMuted} 
                                                playsInline 
                                                className="w-full h-full object-cover"
                                                onTimeUpdate={handleTimeUpdate}
                                            />
                                        ) : (
                                            <img src={file} className="w-full h-full object-cover" alt="Preview" />
                                        )}

                                        <div className="safe-zone-overlay">
                                            <svg className="w-full h-full" viewBox="0 0 100 177.7" preserveAspectRatio="none">
                                                <defs>
                                                    <mask id="sz-mask">
                                                        <rect width="100" height="177.7" fill="white" />
                                                        <rect 
                                                           x={zones.left} 
                                                           y={zones.top} 
                                                           width={100 - zones.left - zones.right}
                                                           height={177.7 - zones.top - (177.7 * zones.bottom / 100)}
                                                           fill="black" 
                                                        />
                                                        {zones.notch && (
                                                            <rect 
                                                              x={100 - zones.notchW} 
                                                              y={177.7 - (177.7 * zones.bottom / 100) - zones.notchH} 
                                                              width={zones.notchW} 
                                                              height={zones.notchH} 
                                                              fill="white" 
                                                            />
                                                        )}
                                                    </mask>
                                                </defs>
                                                <rect width="100" height="177.7" fill="#E6BD71" fillOpacity="0.45" mask="url(#sz-mask)" />
                                            </svg>
                                        </div>
                                    </>
                                )}
                            </div>

                            {/* Video Control Bar */}
                            {file && fileType === 'video' && (
                                <div className="mt-3 2xl:mt-5 w-full bg-white/[0.04] border border-[#E6BD71]/20 rounded-xl p-2.5 2xl:p-4 flex items-center gap-2.5 2xl:gap-4 shadow-lg animate-fade-in backdrop-blur-md">
                                    <button onClick={togglePlay} className="text-[#E6BD71] hover:text-white transition-colors focus:outline-none">
                                        <Icon name={isPlaying ? "pause" : "play"} className="w-3.5 h-3.5 2xl:w-5 2xl:h-5 fill-current" />
                                    </button>
                                    
                                    <input 
                                        type="range" 
                                        min="0" 
                                        max="100" 
                                        value={progress} 
                                        onChange={handleSeek}
                                        className="flex-1"
                                    />
                                    
                                    <button onClick={toggleMute} className="text-[#E6BD71] hover:text-white transition-colors focus:outline-none">
                                        <Icon name={isMuted ? "volume-x" : "volume-2"} className="w-3.5 h-3.5 2xl:w-5 2xl:h-5" />
                                    </button>
                                </div>
                            )}

                            {/* Format Status Indikator */}
                            {file && (
                                <div className={`mt-3 2xl:mt-5 w-full flex items-center justify-center gap-1.5 2xl:gap-3 px-3 2xl:px-6 py-2 2xl:py-3 rounded-xl animate-fade-in ${is916 ? 'bg-green-500/10 border border-green-500/20 text-green-400' : 'format-warning'}`}>
                                    <Icon name={is916 ? 'check-circle' : 'alert-triangle'} className="w-3.5 h-3.5 2xl:w-5 2xl:h-5" />
                                    <span className="text-[8px] xl:text-[9px] 2xl:text-[11px] font-bold uppercase tracking-widest">
                                        {is916 ? 'Korrekt format (9:16)' : 'Forkert format (Ikke 9:16)'}
                                    </span>
                                </div>
                            )}
                        </div>

                        {/* Højre Kolonne: Styringspanel */}
                        <div className="w-full max-w-[280px] lg:max-w-[300px] xl:max-w-[320px] 2xl:max-w-[360px] flex flex-col gap-3 2xl:gap-5 animate-fade-in" style={{ animationDelay: '0.2s' }}>
                            
                            <div className="glass-card rounded-[1.25rem] 2xl:rounded-[2rem] p-4 2xl:p-6 shadow-lg text-[#E6BD71]">
                                <h3 className="text-base xl:text-lg 2xl:text-2xl font-bold mb-2 2xl:mb-4 flex items-center gap-2 2xl:gap-3 tracking-tight">
                                    <Icon name="help-circle" className="w-4 h-4 xl:w-5 xl:h-5 2xl:w-6 2xl:h-6" /> Hvad er safe zone?
                                </h3>
                                <div className="text-[11px] xl:text-[12px] 2xl:text-[15px] leading-relaxed font-normal space-y-1.5 2xl:space-y-3 text-[#f5e6cc]">
                                    <p>En safe zone på Meta, Snapchat og TikTok er det område i dit annonceformat, hvor tekst og vigtige elementer sikkert kan placeres uden at blive dækket af UI-elementer som brugernavn, CTA-knapper, likes eller captions.</p>
                                    <p>For at sikre korrekt visning på stories og reels skal det uploadede content være i <strong>9:16-format</strong>.</p>
                                </div>
                            </div>

                            <div className="glass-card rounded-[1.25rem] 2xl:rounded-[2rem] p-4 2xl:p-6 shadow-lg text-[#E6BD71]">
                                <h3 className="text-base xl:text-lg 2xl:text-2xl font-bold mb-2 2xl:mb-4 flex items-center gap-2 2xl:gap-3 tracking-tight">
                                    <Icon name="smartphone" className="w-4 h-4 xl:w-5 xl:h-5 2xl:w-6 2xl:h-6" /> Vælg Platform
                                </h3>
                                
                                <div className="grid grid-cols-3 gap-1 2xl:gap-2 bg-black/40 p-1 2xl:p-1.5 rounded-xl mb-2 2xl:mb-4">
                                    {['meta', 'tiktok', 'snapchat'].map((p) => (
                                        <button 
                                            key={p}
                                            onClick={() => setPlatform(p)}
                                            className={`py-1.5 2xl:py-2.5 rounded-lg font-bold text-[8px] xl:text-[9px] 2xl:text-[10px] transition-all duration-300 uppercase tracking-widest ${platform === p ? 'bg-[#E6BD71] text-[#16322D] shadow-md scale-[1.02]' : 'opacity-40 hover:opacity-100'}`}
                                        >
                                            {p}
                                        </button>
                                    ))}
                                </div>

                                {platform === 'meta' && (
                                    <div className="flex gap-2 animate-fade-in">
                                        {['reels', 'stories'].map(sub => (
                                            <button 
                                                key={sub}
                                                onClick={() => setSubFormat(sub)}
                                                className={`flex-1 py-1.5 2xl:py-2 rounded-lg font-bold text-[7px] xl:text-[8px] 2xl:text-[9px] border transition-all duration-300 uppercase tracking-widest ${subFormat === sub ? 'border-[#E6BD71] text-[#E6BD71] bg-[#E6BD71]/10 shadow-[0_0_15px_rgba(230,189,113,0.1)]' : 'border-[#E6BD71]/40 text-[#f5e6cc]/70 hover:border-[#E6BD71]/70 hover:text-[#f5e6cc]'}`}
                                            >
                                                {sub}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="glass-card rounded-[1.25rem] 2xl:rounded-[2rem] p-4 2xl:p-6 shadow-lg text-[#E6BD71]">
                                <h3 className="text-base xl:text-lg 2xl:text-2xl font-bold mb-2 2xl:mb-4 flex items-center gap-2 2xl:gap-3 tracking-tight">
                                    <Icon name="info" className="w-4 h-4 xl:w-5 xl:h-5 2xl:w-6 2xl:h-6" /> Sådan gør du
                                </h3>
                                <ul className="space-y-2 2xl:space-y-3">
                                    {[
                                        "Upload dit medie (MP4, JPG, PNG).",
                                        "Vælg din ønskede platform.",
                                        "Hold vigtigt indhold i de klare områder.",
                                        "Brug scrubberen til at fryse videoen."
                                    ].map((text, i) => (
                                        <li key={i} className="flex gap-2.5 2xl:gap-4 items-start text-[11px] xl:text-[12px] 2xl:text-[15px] leading-snug font-normal text-[#f5e6cc]">
                                            <span className="w-3.5 h-3.5 2xl:w-5 2xl:h-5 rounded-full border border-[#E6BD71]/50 flex items-center justify-center text-[7px] 2xl:text-[9px] font-bold shrink-0 mt-0.5 text-[#E6BD71]">
                                                {i + 1}
                                            </span>
                                            {text}
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            {file && (
                                <button
                                    onClick={() => {
                                        setFile(null);
                                        if (fileInputRef.current) fileInputRef.current.value = "";
                                    }}
                                    className="w-full py-3 2xl:py-5 rounded-[1.25rem] 2xl:rounded-[2rem] font-bold flex items-center justify-center gap-2 2xl:gap-4 bg-[#E6BD71] text-[#16322D] text-[9px] xl:text-[10px] 2xl:text-[12px] uppercase tracking-[0.2em] shadow-lg hover:brightness-110 active:scale-95 transition-all duration-300 animate-fade-in"
                                >
                                    <Icon name="refresh-cw" className="w-3.5 h-3.5 2xl:w-5 2xl:h-5" />
                                    Upload ny fil
                                </button>
                            )}
                        </div>
                    </main>

                    {/* Footer - Diskret tilpasset i bunden */}
                    <footer className="w-full flex flex-col items-center gap-1.5 2xl:gap-3 py-4 lg:py-6 2xl:py-12 mt-auto text-center">
                        <p className="text-[10px] xl:text-[11px] 2xl:text-[14px] font-black tracking-[0.6em] uppercase">
                            REKOM Safe Zone Checker
                        </p>
                        <p className="text-[7px] xl:text-[8px] 2xl:text-[10px] tracking-[0.2em] font-bold text-[#E6BD71] uppercase opacity-100">
                            Udviklet af: Frederik Nielsen
                        </p>
                    </footer>

                    <input type="file" ref={fileInputRef} className="hidden" accept="image/*,video/*" onChange={handleFile} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
